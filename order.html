<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng & Đặt Hàng</title>
    <link rel="stylesheet" href="css/site.css">
    <style>
        .order-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .order-items {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-items h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            align-items: flex-start;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            background: #f5f5f5;
        }

        .item-details {
            flex: 1;
        }

        .item-details h4 {
            margin: 0 0 5px 0;
            color: #333;
            font-size: 16px;
        }

        .item-specs {
            font-size: 14px;
            color: #666;
            margin: 5px 0;
        }

        .item-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f5f5f5;
            border-radius: 4px;
            padding: 0;
        }

        .qty-control button {
            width: 25px;
            height: 25px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            border-radius: 2px;
        }

        .qty-control button:hover {
            background: #e0e0e0;
        }

        .qty-control input {
            width: 40px;
            border: none;
            text-align: center;
            background: transparent;
            font-size: 14px;
        }

        .btn-remove {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-remove:hover {
            background: #c82333;
        }

        .item-price {
            text-align: right;
            font-weight: bold;
            color: #007bff;
            font-size: 16px;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-cart p {
            margin: 20px 0;
            font-size: 16px;
        }

        .btn-continue {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn-continue:hover {
            background: #218838;
        }

        .order-summary {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .order-summary h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-row.subtotal {
            color: #666;
        }

        .summary-row.shipping {
            color: #666;
        }

        .summary-row.discount {
            color: #28a745;
        }

        .summary-row.total {
            border-top: 2px solid #eee;
            padding-top: 12px;
            font-weight: bold;
            font-size: 18px;
            color: #dc3545;
        }

        .checkout-section {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 12px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-checkout {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-checkout:hover {
            background: #0056b3;
        }

        .btn-checkout:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .breadcrumb {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            font-size: 14px;
            color: #666;
        }

        .breadcrumb a {
            color: #007bff;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .order-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .item-image {
                order: -1;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>🛒 Shop Online</h1>
        <nav class="nav">
            <a href="index.html" class="nav-link">🏠 Trang chủ</a>
            <a href="about.html" class="nav-link">ℹ️ Giới thiệu</a>
            <a href="order.html" class="nav-link active">
                🛒 Giỏ hàng
                <span id="cart-count" class="cart-badge">0</span>
            </a>
        </nav>
    </div>
    <p>Quản lý đơn hàng của bạn</p>
</header>

<main>
    <div class="breadcrumb">
        <a href="index.html">Trang chủ</a>
        <span>/</span>
        <span>Giỏ hàng</span>
    </div>

    <div class="order-container">
        <div class="order-items">
            <h2>📦 Chi tiết đơn hàng</h2>
            <div id="cart-list"></div>
        </div>

        <div class="order-summary">
            <h3>💰 Tóm tắt đơn hàng</h3>
            
            <div class="summary-row subtotal">
                <span>Tạm tính:</span>
                <span id="subtotal">₫0</span>
            </div>
            
            <div class="summary-row shipping">
                <span>Phí vận chuyển:</span>
                <span id="shipping">₫0</span>
            </div>

            <div class="summary-row discount">
                <span>Giảm giá:</span>
                <span id="discount">-₫0</span>
            </div>

            <div class="summary-row total">
                <span>Tổng cộng:</span>
                <span id="total">₫0</span>
            </div>

            <div class="checkout-section">
                <div class="form-group">
                    <label>👤 Họ và tên *</label>
                    <input type="text" id="fullname" placeholder="Nhập họ và tên" required>
                </div>

                <div class="form-group">
                    <label>📱 Số điện thoại *</label>
                    <input type="tel" id="phone" placeholder="Nhập số điện thoại" required>
                </div>

                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="Nhập email">
                </div>

                <div class="form-group">
                    <label>📍 Địa chỉ giao hàng *</label>
                    <textarea id="address" placeholder="Nhập địa chỉ chi tiết" required></textarea>
                </div>

                <div class="form-group">
                    <label>🏙️ Tỉnh thành *</label>
                    <select id="province" required>
                        <option value="">-- Chọn tỉnh thành --</option>
                        <option value="Ho Chi Minh">Hồ Chí Minh</option>
                        <option value="Ha Noi">Hà Nội</option>
                        <option value="Da Nang">Đà Nẵng</option>
                        <option value="Hai Phong">Hải Phòng</option>
                        <option value="Can Tho">Cần Thơ</option>
                        <option value="Other">Tỉnh thành khác</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💳 Phương thức thanh toán</label>
                    <select id="payment-method">
                        <option value="cod">Thu tiền khi giao hàng</option>
                        <option value="bank">Chuyển khoản ngân hàng</option>
                        <option value="credit">Thẻ tín dụng</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📝 Ghi chú (Tùy chọn)</label>
                    <textarea id="notes" placeholder="Ghi chú thêm cho đơn hàng..."></textarea>
                </div>

                <button class="btn-checkout" id="submit-order" onclick="submitOrder()">✅ Đặt hàng</button>
            </div>
        </div>
    </div>
</main>

<footer>
    © 2026 - Shop HTML cơ bản
</footer>

<script>
    // Product database
    const products = {
        'ao-thun-nam': {
            name: 'Áo thun nam',
            price: 199000,
            image: 'images/product1.jpg'
        },
        'quan-jean': {
            name: 'Quần jean',
            price: 299000,
            image: 'images/product2.jpg'
        },
        'giay-the-thao': {
            name: 'Giày thể thao',
            price: 499000,
            image: 'images/product3.jpg'
        },
        'ao-khoac': {
            name: 'Áo khoác',
            price: 599000,
            image: 'images/product4.jpg'
        }
    };

    // Get cart from localStorage
    function getCart() {
        const cart = localStorage.getItem('cart');
        return cart ? JSON.parse(cart) : [];
    }

    // Save cart to localStorage
    function saveCart(cart) {
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartDisplay();
        updateSummary();
    }

    // Add item to cart
    function addToCart(productKey, size, color, quantity) {
        const product = products[productKey];
        if (!product) return;

        const cart = getCart();
        const existingItem = cart.find(item => 
            item.productKey === productKey && item.size === size && item.color === color
        );

        if (existingItem) {
            existingItem.quantity += parseInt(quantity);
        } else {
            cart.push({
                productKey: productKey,
                name: product.name,
                price: product.price,
                image: product.image,
                size: size,
                color: color,
                quantity: parseInt(quantity)
            });
        }

        saveCart(cart);
    }

    // Remove item from cart
    function removeFromCart(index) {
        const cart = getCart();
        cart.splice(index, 1);
        saveCart(cart);
    }

    // Update item quantity
    function updateQuantity(index, newQuantity) {
        const cart = getCart();
        if (newQuantity < 1) {
            removeFromCart(index);
        } else {
            cart[index].quantity = newQuantity;
            saveCart(cart);
        }
    }

    // Display cart items
    function updateCartDisplay() {
        const cart = getCart();
        const cartList = document.getElementById('cart-list');
        const cartCount = document.getElementById('cart-count');

        cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

        if (cart.length === 0) {
            cartList.innerHTML = `
                <div class="empty-cart">
                    <p>🛒 Giỏ hàng của bạn đang trống</p>
                    <a href="index.html" class="btn-continue">Tiếp tục mua sắm</a>
                </div>
            `;
            document.getElementById('submit-order').disabled = true;
            return;
        }

        document.getElementById('submit-order').disabled = false;

        cartList.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
                <img src="${item.image}" alt="${item.name}" class="item-image">
                <div class="item-details">
                    <h4>${item.name}</h4>
                    <div class="item-specs">
                        <div>🎨 Màu: <strong>${item.color || 'Đen'}</strong></div>
                        <div>🏷️ Size: <strong>${item.size || 'M'}</strong></div>
                    </div>
                    <div class="item-actions">
                        <div class="qty-control">
                            <button onclick="updateQuantity(${index}, ${item.quantity - 1})">−</button>
                            <input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)">
                            <button onclick="updateQuantity(${index}, ${item.quantity + 1})">+</button>
                        </div>
                        <button class="btn-remove" onclick="removeFromCart(${index})">🗑️ Xóa</button>
                    </div>
                </div>
                <div class="item-price">
                    ${(item.price * item.quantity).toLocaleString('vi-VN')}₫
                </div>
            </div>
        `).join('');
    }

    // Update order summary
    function updateSummary() {
        const cart = getCart();
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const shipping = subtotal > 500000 ? 0 : 25000;
        const discount = Math.floor(subtotal * 0.05);
        const total = subtotal + shipping - discount;

        document.getElementById('subtotal').textContent = subtotal.toLocaleString('vi-VN') + '₫';
        document.getElementById('shipping').textContent = shipping.toLocaleString('vi-VN') + '₫';
        document.getElementById('discount').textContent = '-' + discount.toLocaleString('vi-VN') + '₫';
        document.getElementById('total').textContent = total.toLocaleString('vi-VN') + '₫';
    }

    // Submit order
    function submitOrder() {
        const fullname = document.getElementById('fullname').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const address = document.getElementById('address').value.trim();
        const province = document.getElementById('province').value;
        const cart = getCart();

        if (!fullname || !phone || !address || !province) {
            alert('❌ Vui lòng điền đầy đủ thông tin bắt buộc!');
            return;
        }

        if (cart.length === 0) {
            alert('❌ Giỏ hàng của bạn đang trống!');
            return;
        }

        if (!/^[0-9]{10}$/.test(phone.replace(/\D/g, ''))) {
            alert('❌ Số điện thoại không hợp lệ!');
            return;
        }

        // Create order summary
        const orderItems = cart.map(item => 
            `${item.name} (Size: ${item.size}, Màu: ${item.color}, SL: ${item.quantity})`
        ).join('\n');

        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const shipping = subtotal > 500000 ? 0 : 25000;
        const total = subtotal + shipping - Math.floor(subtotal * 0.05);

        const orderSummary = `
📦 ĐƠN HÀNG CỦA BẠN ĐÃ ĐƯỢC TẠO!

👤 Khách hàng: ${fullname}
📱 Phone: ${phone}
📧 Email: ${document.getElementById('email').value || 'Không có'}
📍 Địa chỉ: ${address}, ${province}
💳 Thanh toán: ${document.getElementById('payment-method').options[document.getElementById('payment-method').selectedIndex].text}

📝 Sản phẩm:
${orderItems}

💰 Thành tiền: ${subtotal.toLocaleString('vi-VN')}₫
🚚 Vận chuyển: ${shipping.toLocaleString('vi-VN')}₫
💵 Tổng tiền: ${total.toLocaleString('vi-VN')}₫

Cảm ơn bạn đã mua sắm! Đơn hàng sẽ được xử lý sớm.
        `;

        alert(orderSummary);
        
        // Clear cart after successful order
        localStorage.removeItem('cart');
        
        // Reset form
        document.getElementById('fullname').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('email').value = '';
        document.getElementById('address').value = '';
        document.getElementById('province').value = '';
        document.getElementById('notes').value = '';

        updateCartDisplay();
        updateSummary();
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', function() {
        updateCartDisplay();
        updateSummary();

        // Check if coming from product detail page
        const params = new URLSearchParams(window.location.search);
        const productKey = params.get('product');
        const size = params.get('size') || 'L';
        const color = params.get('color') || 'Đen';
        const quantity = params.get('quantity') || '1';

        if (productKey && products[productKey]) {
            addToCart(productKey, size, color, quantity);
        }
    });

    // Make addToCart globally accessible for product-detail.html
    window.addToCart = addToCart;
</script>
</body>
</html>
